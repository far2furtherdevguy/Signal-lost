<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Lost - Server Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e17; color: #e8ecf8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #141a2a; border: 1px solid #1f2942; border-radius: 16px;
      padding: 40px; text-align: center; max-width: 420px; width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .on  { background: #00e676; box-shadow: 0 0 12px #00e676; }
    .off { background: #ff5252; box-shadow: 0 0 12px #ff5252; }
    h1 { letter-spacing: 4px; margin: 16px 0 4px; }
    .sub { color: #8b94ad; margin-bottom: 24px; }
    .stats { display: flex; justify-content: space-around; margin: 24px 0; }
    .stat b { font-size: 22px; display: block; color: #00e5ff; }
    .stat span { font-size: 12px; color: #8b94ad; }
    button {
      background: #00e5ff; color: #06232b; border: none; padding: 12px 24px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #5beeff; }
    .foot { margin-top: 20px; font-size: 11px; color: #525b75; }
    #log { margin-top: 16px; font-size: 12px; color: #8b94ad; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div><span id="dot" class="dot off"></span><span id="status">Checking server...</span></div>
    <h1>SIGNAL LOST</h1>
    <p class="sub">Deep-space relay station status</p>
    <div class="stats">
      <div class="stat"><b id="online">-</b><span>ONLINE</span></div>
      <div class="stat"><b id="rooms">-</b><span>ROOMS</span></div>
      <div class="stat"><b id="queue">-</b><span>IN QUEUE</span></div>
    </div>
    <button onclick="pingServer(true)">PING SERVER</button>
    <div id="log"></div>
    <p class="foot">This page keeps the free-tier server awake.<br>UptimeRobot pings it every 5 minutes.</p>
  </div>

  <script>
    // >>> CHANGE THIS TO YOUR RENDER SERVER URL (https, not wss) <<<
    const SERVER = 'https://signal-lost-server.onrender.com';

    async function pingServer(manual) {
      const dot = document.getElementById('dot');
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      try {
        const r = await fetch(SERVER + '/health', { cache: 'no-store' });
        const d = await r.json();
        dot.className = 'dot on';
        status.textContent = 'Server online';
        document.getElementById('online').textContent = d.playersOnline ?? '-';
        document.getElementById('rooms').textContent = d.rooms ?? '-';
        document.getElementById('queue').textContent = d.queue ?? '-';
        log.textContent = 'Last check: ' + new Date().toLocaleTimeString() + ' — all systems nominal';
      } catch (e) {
        dot.className = 'dot off';
        status.textContent = 'Server unreachable';
        log.textContent = 'Last check: ' + new Date().toLocaleTimeString() + ' — signal lost!';
      }
    }
    pingServer();
    // keep this tab useful: refresh status every 5 minutes
    setInterval(pingServer, 5 * 60 * 1000);
  </script>
</body>
</html>
